; ==============================================================================
; Granite Module 配置文件 (NBA 2K22)
; 将此文件置于 Module.dll 同级目录即可生效，修改后下次启动游戏生效
; 若此文件不存在，模块自动生成默认配置；缺失或非法键值使用默认值（仅接受 0/1）
; EnableFileLogging 仅控制 .log；崩溃报告与 .dmp 由 EnableCrashHandler 独立控制
; 名单诊断只使用 EnableParkRosterTrace，旧 ParkRosterTrace.enabled 文件不再生效
; ==============================================================================

[Features]
; 是否启用崩溃转储保护与 Minidump (.dmp) 生成（1=开启捕获转储，0=完全关闭）
EnableCrashHandler = 1

; 是否启用单人公园名单内存追踪诊断（用于排查闪退的诊断工具，正常游戏请保持 0）
EnableParkRosterTrace = 0

; 是否启用生涯属性价格直连与看门狗线程（1=开启，0=关闭）
EnablePriceWatchdog = 1

; 是否启用生涯徽章预算透明上报（1=开启，0=关闭）
EnableBadgeBudgets = 1

; 显示全部原生动画商店候选，取消赛季、排除清单及动作规则的列表过滤（不改变原生分类）
EnableAnimationShopAll = 1

; 忽略投篮、运球等动画的身高/属性/进度资格限制，允许按原购买流程购买和装备
EnableAnimationRequirementBypass = 1

; 全动画视为已拥有，包含资格放行，无需购买即可装备（不批量写入库存）
; 开启后商店会显示已拥有，不再提供正常购买；关闭不会撤销已保存的装备选择
EnableAnimationUnlockAll = 0

[Logging]
; 是否在 console logs 文件夹下生成并写入 .log 日志文件（1=生成日志文件，0=完全不写文件）
EnableFileLogging = 1

; 是否弹出/分配控制台黑框窗口（1=弹出控制台窗口，0=彻底隐藏纯静默运行）
EnableConsole = 1

; 是否打印 SOLO22 单人开赛校验与名单生成日志（1=开启，0=关闭）
LogSoloPark = 0

; 是否打印 PARKTRACE 内存十六进制转储日志（1=开启，0=关闭）
LogParkRosterTrace = 0

; 是否打印生涯属性价格同步与看门狗轮询日志（1=开启，0=关闭）
LogAttributePrice = 0

; 是否打印徽章预算缓冲与上报日志（1=开启，0=关闭）
LogBadgeBudget = 0
