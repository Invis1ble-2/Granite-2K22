; Granite Module (NBA 2K22)
; Keep beside Module.dll. Restart the game to apply changes.
; Toggles: 1 = on, 0 = off. Missing or invalid values use defaults.

[Network]
; Server IPv4; use the same address as server PublicHost.
ServerHost = 127.0.0.1
; Granite HTTPS port (1-65535).
ServerPort = 21000

[Features]
; Crash reports and minidumps; independent of file logging.
EnableCrashHandler = 1

; Career attribute price sync and watchdog.
EnablePriceWatchdog = 1

; Career badge budget reporting.
EnableBadgeBudgets = 1

; Show all animation shop items.
EnableAnimationShopAll = 1

; Bypass animation requirements; purchases still required.
EnableAnimationRequirementBypass = 1

; Treat all animations as owned; replaces normal purchases.
EnableAnimationUnlockAll = 0

[Logging]
; Write .log files to console logs.
EnableFileLogging = 1

; Show the console window.
EnableConsole = 1

; Category toggles below never suppress errors.
; General module logs.
LogModule = 0

; HTTP requests and redirects.
LogHttp = 1

; Native park and online session logs.
LogNativePark = 0

; Online frame rate logs.
LogOnlineFrameRate = 0

; Career progression sync logs.
LogCareerProgression = 0

; Solo park validation and roster logs.
LogSoloPark = 0

; Attribute price sync logs.
LogAttributePrice = 0

; Badge budget logs.
LogBadgeBudget = 0

; Animation setup logs.
LogAnimationUnlock = 0
